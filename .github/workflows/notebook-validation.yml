name: PolSAR notebook validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "01_polsar_decomposition_classification.ipynb"
      - "requirements.txt"
      - ".github/workflows/notebook-validation.yml"
  pull_request:
    paths:
      - "01_polsar_decomposition_classification.ipynb"
      - "requirements.txt"
      - ".github/workflows/notebook-validation.yml"

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nbclient nbformat ipykernel
      - name: Execute notebook and validate artifacts
        run: |
          python - <<'PY'
          from nbclient import NotebookClient
          import nbformat
          from pathlib import Path
          notebook = Path('01_polsar_decomposition_classification.ipynb')
          nb = nbformat.read(notebook, as_version=4)
          result = NotebookClient(nb, timeout=240, kernel_name='python3').execute()
          nbformat.write(result, 'executed-notebook.ipynb')
          expected = ['01_synthetic_inputs.png', '02_decomposition_features.png',
                      '03_classification_comparison.png', '04_synthetic_confusion_matrices.png',
                      '05_h_alpha_scatter.png', 'experiment_report.json']
          for name in expected:
              assert (Path('figures') / name).is_file(), f'Missing artifact: {name}'
          import json
          report = json.loads((Path('figures') / 'experiment_report.json').read_text())
          assert report['data_mode'] == 'synthetic multi-look coherency matrices'
          assert 0 <= report['independent_synthetic_test_scores']['full_polsar']['macro_f1'] <= 1
          print('Synthetic notebook executed. Artifacts and data provenance verified.')
          PY
      - name: Upload reproducible outputs
        uses: actions/upload-artifact@v4
        with:
          name: polsar-synthetic-poc
          path: |
            executed-notebook.ipynb
            figures/*.png
            figures/experiment_report.json
