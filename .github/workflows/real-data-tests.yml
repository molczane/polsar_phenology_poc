name: Real-data pipeline tests

on:
  push:
    branches: [main, feat/real-data-acquisition]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-real-data.txt'
      - '.github/workflows/real-data-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-real-data.txt'
      - '.github/workflows/real-data-tests.yml'

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-real-data.txt nbclient nbformat ipykernel
      - name: Validate offline pipeline
        run: python -m pytest -q tests/
